name: Test

on:
  pull_request:
    branches: [main, V9]
  push:
    branches: [main, V9]

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --no-immutable
          cd src/plugin/internal/service/webui/FE && npm install

      - name: Run unit tests
        run: npm run test:unit

      - name: Run WebUI tests
        run: npm run test:webui

  e2e-test:
    name: NTQQ / OneBot Host Integration
    runs-on: [self-hosted, llbot-test]
    needs: [unit-test]
    if: github.event_name == 'pull_request'
    env:
      ONEBOT_PLUGIN_DIR: ${{ github.workspace }}/_integration/onebot
      NTQQ_PLUGIN_DIR: ${{ github.workspace }}/_integration/ntqq
      FFMPEG_PLUGIN_DIR: ${{ github.workspace }}/_integration/ffmpeg
      E2E_ROOT: ${{ github.workspace }}/output/onebot-e2e
      QQ_BASE_IMAGE: ${{ vars.QQ_BASE_IMAGE }}
    steps:
      - name: Cleanup previous fixture ownership
        run: sudo rm -rf -- "$GITHUB_WORKSPACE/output/onebot-e2e" "$GITHUB_WORKSPACE/workspace1" "$GITHUB_WORKSPACE/workspace2"

      - name: Checkout Bot host
        uses: actions/checkout@v4

      - name: Checkout NTQQ plugin source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NTQQ_REPOSITORY || 'LuckyLilliaDev/lucky-lillia-plugin-ntqq-protocol' }}
          ref: ${{ vars.NTQQ_REF || 'main' }}
          path: _integration/ntqq
          persist-credentials: false

      - name: Checkout OneBot plugin and integration suite
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ONEBOT_REPOSITORY || 'LuckyLilliaDev/lucky-lillia-plugin-onebot11' }}
          ref: ${{ vars.ONEBOT_REF || 'main' }}
          path: _integration/onebot
          persist-credentials: false

      - name: Checkout optional media plugin for full API coverage
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FFMPEG_REPOSITORY || 'LuckyLilliaDev/lucky-lillia-plugin-ffmpeg' }}
          ref: ${{ vars.FFMPEG_REF || 'main' }}
          path: _integration/ffmpeg
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and build Bot host
        run: |
          corepack enable
          yarn install --no-immutable
          npm install --prefix src/plugin/internal/service/webui/FE
          npm run build
          npm run build-webui

      - name: Build plugin sources and prepare isolated fixtures
        run: bash script/native-e2e.sh prepare

      - name: Build native QQ host image
        run: bash script/native-e2e.sh build

      - name: Start native QQ and Bot hosts
        run: bash script/native-e2e.sh start

      - name: Wait for both expected QQ identities
        run: bash script/native-e2e.sh wait

      - name: Run OneBot integration suite against Bot host
        run: bash script/native-e2e.sh test

      - name: Stop hosts and restore existing fixtures
        if: always()
        run: bash script/native-e2e.sh stop

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onebot-host-e2e-report
          path: output/onebot-e2e/api/test-report.html
          retention-days: 30

  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [unit-test, e2e-test]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Generate report comment
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              'unit-test': '${{ needs.unit-test.result }}',
              'e2e-test': '${{ needs.e2e-test.result }}',
            };

            const icons = { success: '✅', failure: '❌', skipped: '⏭️', cancelled: '🚫' };
            const lines = Object.entries(jobs).map(([name, result]) =>
              `| ${name} | ${icons[result] || '❓'} ${result} |`
            );

            const allPassed = Object.values(jobs).every(r => r === 'success' || r === 'skipped');
            const summary = allPassed ? '✅ All tests passed' : '❌ Some tests failed';

            const body = [
              `## Test Report`,
              ``,
              `| Job | Status |`,
              `|-----|--------|`,
              ...lines,
              ``,
              summary,
            ].join('\n');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Test Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
